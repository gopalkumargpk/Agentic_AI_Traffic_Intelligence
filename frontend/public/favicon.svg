<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#161929"/>
    </linearGradient>
    <linearGradient id="aiPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#aiPulse)" stroke-width="2.5"/>

  <!-- AI Circuit Connection Lines -->
  <path d="M12 20 H20 M12 32 H20 M12 44 H20 M44 20 H52 M44 32 H52 M44 44 H52" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="12" cy="20" r="1.5" fill="#22d3ee"/>
  <circle cx="12" cy="32" r="1.5" fill="#6366f1"/>
  <circle cx="12" cy="44" r="1.5" fill="#10b981"/>
  <circle cx="52" cy="20" r="1.5" fill="#ef4444"/>
  <circle cx="52" cy="32" r="1.5" fill="#f59e0b"/>
  <circle cx="52" cy="44" r="1.5" fill="#22d3ee"/>

  <!-- Traffic Signal Housing -->
  <rect x="22" y="10" width="20" height="44" rx="10" fill="#111420" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Red Signal Light -->
  <circle cx="32" cy="18" r="5" fill="#ef4444" opacity="0.45"/>
  <circle cx="32" cy="18" r="3.5" fill="#ef4444" opacity="0.7"/>

  <!-- Amber Signal Light -->
  <circle cx="32" cy="32" r="5" fill="#f59e0b" opacity="0.45"/>
  <circle cx="32" cy="32" r="3.5" fill="#f59e0b" opacity="0.7"/>

  <!-- Active AI Green Signal Light with Glow -->
  <circle cx="32" cy="46" r="6" fill="#10b981" filter="url(#glow)"/>
  <circle cx="32" cy="46" r="4.5" fill="#34d399"/>
  <circle cx="30.5" cy="44.5" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
